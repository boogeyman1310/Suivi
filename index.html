<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi">
<meta name="theme-color" content="#0E7C86">
<title>Suivi</title>
<style>
:root{--bg:#EEF2F4;--card:#fff;--ink:#14202B;--mute:#5B6B78;--acc:#0E7C86;--acc-ink:#fff;--soft:#D8ECEE;--amb:#F0A93B;--line:#DCE3E8;--r:16px;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F161C;--card:#18222B;--ink:#E8EEF2;--mute:#93A3B0;--acc:#3DC1CC;--acc-ink:#0B1B1E;--soft:#17383C;--line:#26343E}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:30px;line-height:1.1;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 10px}
p{margin:0 0 10px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:14px 0;border:1px solid var(--line)}
.hero{background:var(--acc);color:var(--acc-ink);border:0}
.hero .mute{color:inherit;opacity:.85}
.hero p{font-size:19px;line-height:1.35;font-weight:600;margin:0}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0 2px}
.day{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.dot{width:100%;aspect-ratio:1;max-width:38px;margin:4px auto 0;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--acc-ink)}
.dot.on{background:var(--acc);border-color:var(--acc)}
.day.now .dot{border-color:var(--amb)}
.chips{display:grid;gap:8px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--acc);color:var(--acc-ink);font-weight:650;cursor:pointer;width:100%}
button.alt{background:var(--soft);color:var(--ink)}
button.chip{display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--ink);border:2px solid var(--line);text-align:left}
button.chip.on{border-color:var(--acc);background:var(--soft)}
button:focus-visible,input:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input:not([type]){font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}
.row>*{flex:1}.row>button{flex:0 0 auto;width:auto}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--amb);border-radius:6px}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.ex b{display:block}
.ph{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.ph.cur{font-weight:700;color:var(--acc)}
.list li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);list-style:none}
ul{padding:0;margin:0}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;margin:0 6px 8px 0;font-size:14px;background:var(--line);color:var(--mute)}
.badge.on{background:var(--amb);color:#2a1d00;font-weight:650}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mute);padding:10px 4px;font-size:13px;font-weight:600;border-radius:10px}
nav button.on{color:var(--acc);background:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
const KEY='suivi_v1';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const todayK=()=>iso(new Date());
const fmtKg=n=>n.toFixed(1).replace('.',',');

function fresh(){return{start:todayK(),weights:[],log:{}}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');return o&&o.log?o:fresh()}catch(e){return fresh()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Sauvegarde impossible : stockage bloqué')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}

const weekOf=d=>Math.max(1,Math.round((mon(d)-mon(parse(S.start)))/864e5/7)+1);
const phaseOf=w=>w<=2?0:w<=4?1:w<=8?2:3;
const homeTarget=w=>w<=2?2:3;

const PH=[
{t:'Reprendre doucement',m:10,r:2,w:'semaines 1-2',ex:[
['Squat sur chaise','8 répétitions','Assieds-toi, puis relève-toi sans les mains.'],
['Pompes contre le mur','8 répétitions','Corps bien droit, du talon à la tête.'],
['Pont fessier','10 répétitions','Au sol, pousse avec les talons.'],
['Tirage avec élastique','10 répétitions','Prends l’élastique le plus léger.'],
['Planche sur les genoux','15 secondes','Dos plat, ventre serré.']]},
{t:'Prendre le rythme',m:15,r:3,w:'semaines 3-4',ex:[
['Squat sur chaise','10 répétitions','Descends plus lentement.'],
['Pompes inclinées','8 répétitions','Mains sur une table ou un canapé.'],
['Pont fessier','12 répétitions','Serre les fessiers 1 seconde en haut.'],
['Tirage avec élastique','12 répétitions','Élastique léger ou moyen.'],
['Planche sur les genoux','20 secondes','Respire normalement.']]},
{t:'Ajouter de la charge',m:20,r:3,w:'semaines 5-8',ex:[
['Squat avec haltères','12 répétitions','Un haltère de 1 kg dans chaque main.'],
['Pompes inclinées','10 répétitions','Mains sur un support plus bas.'],
['Pont fessier','15 répétitions','Garde le bassin bien haut.'],
['Tirage avec élastique','15 répétitions','Élastique moyen.'],
['Élévations latérales','12 répétitions','Haltères de 1 kg, bras presque tendus.'],
['Planche sur les avant-bras','30 secondes','Sur les genoux si c’est trop dur.']]},
{t:'Gagner en force',m:25,r:3,w:'semaine 9 et après',ex:[
['Squat avec haltères','15 répétitions','Descends cuisses parallèles au sol.'],
['Pompes inclinées','12 répétitions','Mains sur un support encore plus bas.'],
['Fentes arrière','8 par jambe','Garde-toi près d’un mur au début.'],
['Tirage avec élastique','15 répétitions','Élastique le plus fort.'],
['Développé épaules','12 répétitions','Haltères de 1 kg.'],
['Planche sur les avant-bras','40 secondes','Corps aligné.']]}
];
const MSG=['Dix minutes, c’est déjà gagné. Le plus dur est de commencer.','Ne cherche pas la perfection, cherche la régularité.','Une séance faite, c’est une habitude qui se construit.','Ton corps s’adapte plus vite que tu ne le crois.','Même une séance courte compte. Fais-la.','Tu n’as pas besoin d’être motivé, juste de démarrer.','Chaque semaine tenue vaut mieux qu’une semaine parfaite.','Moins d’excuses, plus de tapis. Dix minutes suffisent.','Ce que tu fais aujourd’hui, tu le sentiras dans un mois.','Une journée ratée ne change rien. Reprends demain.'];

const TYPES=[['bureau','Bureau : vélo ou marche'],['arc','Tir à l’arc'],['maison','Séance maison']];
const DAYS=['L','M','M','J','V','S','D'];
let tab='today',done={};

function dayLog(k){return S.log[k]||[]}
function toggle(k,t){const a=dayLog(k).slice();const i=a.indexOf(t);i>=0?a.splice(i,1):a.push(t);if(a.length)S.log[k]=a;else delete S.log[k];save();render()}
function countHome(from,to){let n=0;for(let d=new Date(from);d<=to;d=addD(d,1))if(dayLog(iso(d)).includes('maison'))n++;return n}
function totalHome(){return Object.values(S.log).filter(a=>a.includes('maison')).length}
function weekCompleteAny(){const m={};for(const k in S.log)if(S.log[k].includes('maison')){const w=weekOf(parse(k));m[w]=(m[w]||0)+1}return Object.keys(m).some(w=>m[w]>=homeTarget(+w))}

function vToday(){
const now=new Date(),k=todayK(),w=weekOf(now),p=PH[phaseOf(w)],m=mon(now);
const hm=countHome(m,addD(m,6)),tg=homeTarget(w);
let wk='';for(let i=0;i<7;i++){const d=addD(m,i),on=dayLog(iso(d)).length>0;wk+=`<div class="day${iso(d)===k?' now':''}">${DAYS[i]}<div class="dot${on?' on':''}">${on?'✓':''}</div></div>`}
const dayN=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5);
const last=S.weights.length?S.weights[S.weights.length-1]:null;
return`<h1>Semaine ${w}</h1><p class="mute">${p.t} : séances de ${p.m} minutes</p>
<div class="card hero"><p>${MSG[dayN%MSG.length]}</p></div>
<div class="card"><h2>Aujourd’hui</h2><div class="chips">${TYPES.map(([id,l])=>`<button class="chip${dayLog(k).includes(id)?' on':''}" onclick="toggle('${k}','${id}')"><span>${l}</span><span>${dayLog(k).includes(id)?'✓ Fait':'Marquer fait'}</span></button>`).join('')}</div>
<p class="mute" style="margin-top:10px">Pour la séance maison, ouvre l’onglet Séance : elle se coche toute seule à la fin.</p></div>
<div class="card"><h2>Cette semaine</h2><div class="week">${wk}</div>
<p style="margin-top:12px">Séances maison : <b>${hm} sur ${tg}</b></p><div class="bar"><i style="width:${Math.min(100,hm/tg*100)}%"></i></div></div>
<div class="card"><h2>Poids</h2>${last?`<p class="mute">Dernière pesée : ${fmtKg(last.kg)} kg le ${parse(last.d).toLocaleDateString('fr-FR')}</p>`:'<p class="mute">Aucune pesée pour l’instant.</p>'}
<div class="row"><input id="kg" inputmode="decimal" placeholder="Poids en kg" aria-label="Poids en kg"><button onclick="addW()">Enregistrer</button></div></div>`}

function vSession(){
const w=weekOf(new Date()),i=phaseOf(w),p=PH[i];
return`<h1>Séance maison</h1><p class="mute">${p.t} : environ ${p.m} minutes</p>
<div class="card"><h2>Échauffement (2 minutes)</h2><p class="mute">Cercles d’épaules, montées de genoux, rotations du bassin.</p></div>
<div class="card"><h2>${p.r} tours</h2><p class="mute">Enchaîne les exercices, repose-toi 45 secondes entre chaque tour. Coche au fur et à mesure.</p>
${p.ex.map((e,n)=>`<label class="ex"><input type="checkbox" onchange="tick()"><span><b>${e[0]} : ${e[1]}</b><span class="mute">${e[2]}</span></span></label>`).join('')}
<p class="mute" style="margin-top:10px">Une courbature est normale. Une douleur vive ne l’est pas : arrête-toi.</p></div>
<button onclick="finish()">Terminer la séance</button>
<div class="card"><h2>La progression</h2>${PH.map((x,n)=>`<div class="ph${n===i?' cur':''}"><span>${x.t}</span><span>${x.m} min, ${x.w}</span></div>`).join('')}
<p class="mute" style="margin-top:8px">Si une phase te semble trop dure, reste-y une semaine de plus. Il n’y a pas de retard.</p></div>`}
function tick(){}
function finish(){const k=todayK();const a=dayLog(k).slice();if(!a.includes('maison'))a.push('maison');S.log[k]=a;save();toast('Séance enregistrée. Bravo !');tab='today';render()}

function addW(){const el=document.getElementById('kg');const v=parseFloat((el.value||'').replace(',','.'));
if(!(v>=30&&v<=300)){toast('Entre un poids entre 30 et 300 kg');return}
const k=todayK();S.weights=S.weights.filter(x=>x.d!==k);S.weights.push({d:k,kg:Math.round(v*10)/10});S.weights.sort((a,b)=>a.d<b.d?-1:1);save();toast('Pesée enregistrée');render()}
function delW(d){S.weights=S.weights.filter(x=>x.d!==d);save();render()}

function chart(){
const W=S.weights;if(W.length<2)return'<p class="mute">Le graphique apparaît à partir de deux pesées.</p>';
const w=320,h=150,px=28,py=14,ks=W.map(x=>x.kg),lo=Math.min(...ks)-1,hi=Math.max(...ks)+1;
const t0=parse(W[0].d).getTime(),t1=parse(W[W.length-1].d).getTime()||1;
const X=d=>px+(w-px-8)*((parse(d).getTime()-t0)/((t1-t0)||1)),Y=v=>py+(h-2*py)*(1-(v-lo)/(hi-lo));
const pts=W.map(x=>X(x.d).toFixed(1)+','+Y(x.kg).toFixed(1)).join(' ');
return`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Courbe du poids"><line x1="${px}" x2="${w-8}" y1="${Y(hi-1)}" y2="${Y(hi-1)}" stroke="var(--line)"/><line x1="${px}" x2="${w-8}" y1="${Y(lo+1)}" y2="${Y(lo+1)}" stroke="var(--line)"/>
<text x="0" y="${Y(hi-1)+4}" font-size="10" fill="var(--mute)">${Math.round(hi-1)}</text><text x="0" y="${Y(lo+1)+4}" font-size="10" fill="var(--mute)">${Math.round(lo+1)}</text>
<polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${W.map(x=>`<circle cx="${X(x.d)}" cy="${Y(x.kg)}" r="4" fill="var(--acc)"/>`).join('')}</svg>`}

function vWeight(){
const W=S.weights;let diff='';
if(W.length>1){const d=W[W.length-1].kg-W[0].kg;diff=`<p><b>${d>0?'+':''}${fmtKg(d)} kg</b> depuis la première pesée</p>`}
return`<h1>Poids</h1><p class="mute">Pèse-toi une fois par semaine, le matin, dans les mêmes conditions. C’est la tendance qui compte, pas un chiffre isolé.</p>
<div class="card">${diff}${chart()}</div>
<div class="card"><h2>Ajouter une pesée</h2><div class="row"><input id="kg" inputmode="decimal" placeholder="Poids en kg" aria-label="Poids en kg"><button onclick="addW()">Enregistrer</button></div></div>
<div class="card"><h2>Historique</h2>${W.length?`<ul class="list">${W.slice().reverse().map(x=>`<li><span>${parse(x.d).toLocaleDateString('fr-FR')}</span><span><b>${fmtKg(x.kg)} kg</b> <button class="alt" style="width:auto;padding:4px 10px;margin-left:8px" onclick="delW('${x.d}')" aria-label="Supprimer">✕</button></span></li>`).join('')}</ul>`:'<p class="mute">Rien pour l’instant.</p>'}</div>`}

function vMore(){
const n=totalHome(),act=Object.keys(S.log).length;
const B=[['Première séance maison',n>=1],['5 séances maison',n>=5],['10 séances maison',n>=10],['25 séances maison',n>=25],['Une semaine complète',weekCompleteAny()],['Première pesée',S.weights.length>=1],['20 jours actifs',act>=20]];
return`<h1>Progrès</h1><div class="card"><p><b>${n}</b> séances maison, <b>${act}</b> jours actifs depuis le début.</p>${B.map(b=>`<span class="badge${b[1]?' on':''}">${b[0]}</span>`).join('')}</div>
<div class="card"><h2>Date de départ du programme</h2><p class="mute">Elle fixe la semaine 1 et la progression.</p><div class="row"><input type="date" id="st" value="${S.start}"><button onclick="setStart()">Valider</button></div></div>
<div class="card"><h2>Sauvegarde</h2><p class="mute">Tes données restent dans ce navigateur. Exporte un fichier de temps en temps, ou pour les copier sur un autre appareil.</p>
<div class="chips"><button class="alt" onclick="exp()">Exporter mes données</button><button class="alt" onclick="document.getElementById('f').click()">Importer un fichier</button><input type="file" id="f" accept="application/json,.json" hidden onchange="imp(this)"><button class="alt" onclick="reset()">Tout effacer</button></div></div>
<p class="mute">Ce programme ne remplace pas un avis médical. Parle-en à ton médecin avant d’intensifier.</p>`}
function setStart(){const v=document.getElementById('st').value;if(!v)return;S.start=v;save();toast('Date mise à jour');render()}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='suivi-'+todayK()+'.json';document.body.appendChild(a);a.click();a.remove()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.log||!o.weights||!o.start)throw 0;S=o;save();toast('Données importées');render()}catch(e){toast('Fichier non valide')}};r.readAsText(f)}
function reset(){if(confirm('Effacer toutes tes données sur cet appareil ?')){S=fresh();save();render()}}

const TABS=[['today','Aujourd’hui',vToday],['session','Séance',vSession],['weight','Poids',vWeight],['more','Progrès',vMore]];
function render(){
document.getElementById('app').innerHTML=TABS.find(t=>t[0]===tab)[2]();
document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
}
function go(t){tab=t;render();window.scrollTo(0,0)}
render();
</script>
</body>
</html>
