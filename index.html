<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi">
<meta name="theme-color" content="#0E7C86">
<title>Suivi</title>
<style>
:root{--bg:#EEF2F4;--card:#fff;--ink:#14202B;--mute:#5B6B78;--acc:#0E7C86;--acc-ink:#fff;--soft:#D8ECEE;--amb:#F0A93B;--line:#DCE3E8;--r:16px;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F161C;--card:#18222B;--ink:#E8EEF2;--mute:#93A3B0;--acc:#3DC1CC;--acc-ink:#0B1B1E;--soft:#17383C;--line:#26343E}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:30px;line-height:1.1;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 10px}
p{margin:0 0 10px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:14px 0;border:1px solid var(--line)}
.hero{background:var(--acc);color:var(--acc-ink);border:0}
.hero .mute{color:inherit;opacity:.85}
.hero p{font-size:19px;line-height:1.35;font-weight:600;margin:0}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0 2px}
.day{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.dot{width:100%;aspect-ratio:1;max-width:38px;margin:4px auto 0;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--acc-ink)}
.dot.on{background:var(--acc);border-color:var(--acc)}
.day.now .dot{border-color:var(--amb)}
.chips{display:grid;gap:8px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--acc);color:var(--acc-ink);font-weight:650;cursor:pointer;width:100%}
button.alt{background:var(--soft);color:var(--ink)}
button.chip{display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--ink);border:2px solid var(--line);text-align:left}
button.chip.on{border-color:var(--acc);background:var(--soft)}
button:focus-visible,input:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input:not([type]){font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}
.row>*{flex:1}.row>button{flex:0 0 auto;width:auto}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--amb);border-radius:6px}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.ex b{display:block}
.ph{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.ph.cur{font-weight:700;color:var(--acc)}
.list li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);list-style:none}
ul{padding:0;margin:0}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;margin:0 6px 8px 0;font-size:14px;background:var(--line);color:var(--mute)}
.badge.on{background:var(--amb);color:#2a1d00;font-weight:650}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mute);padding:10px 1px;font-size:11.5px;font-weight:600;border-radius:10px}
nav button.on{color:var(--acc);background:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
svg{display:block;width:100%;height:auto}
details{margin-top:6px}summary{color:var(--acc);font-weight:600;cursor:pointer;padding:4px 0}details p{margin:6px 0 0;font-size:15px}
.row.seg>button{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
const KEY='suivi_v1';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const todayK=()=>iso(new Date());
const fmtKg=n=>n.toFixed(1).replace('.',',');

function fresh(){return norm({start:todayK(),weights:[],log:{},hae:{w:{},s:{}}})}
function norm(o){o.hae=o.hae||{};o.hae.w=o.hae.w||{};o.hae.s=o.hae.s||{};o.rec=o.rec||SEED();o.meals=o.meals||{};o.shop=o.shop||{};o.extra=o.extra||[];return o}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');return o&&o.log?norm(o):fresh()}catch(e){return fresh()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Sauvegarde impossible : stockage bloqué')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}

const weekOf=d=>Math.max(1,Math.round((mon(d)-mon(parse(S.start)))/864e5/7)+1);
const phaseOf=w=>w<=2?0:w<=4?1:w<=8?2:3;
const homeTarget=w=>w<=2?2:3;

const PH=[
{t:'Reprendre doucement',m:10,r:2,w:'semaines 1-2',ex:[
['Squat sur chaise','8 répétitions','Assieds-toi, puis relève-toi sans les mains.'],
['Pompes contre le mur','8 répétitions','Corps bien droit, du talon à la tête.'],
['Pont fessier','10 répétitions','Au sol, pousse avec les talons.'],
['Tirage avec élastique','10 répétitions','Prends l’élastique le plus léger.'],
['Planche sur les genoux','15 secondes','Dos plat, ventre serré.']]},
{t:'Prendre le rythme',m:15,r:3,w:'semaines 3-4',ex:[
['Squat sur chaise','10 répétitions','Descends plus lentement.'],
['Pompes inclinées','8 répétitions','Mains sur une table ou un canapé.'],
['Pont fessier','12 répétitions','Serre les fessiers 1 seconde en haut.'],
['Tirage avec élastique','12 répétitions','Élastique léger ou moyen.'],
['Planche sur les genoux','20 secondes','Respire normalement.']]},
{t:'Ajouter de la charge',m:20,r:3,w:'semaines 5-8',ex:[
['Squat avec haltères','12 répétitions','Un haltère de 1 kg dans chaque main.'],
['Pompes inclinées','10 répétitions','Mains sur un support plus bas.'],
['Pont fessier','15 répétitions','Garde le bassin bien haut.'],
['Tirage avec élastique','15 répétitions','Élastique moyen.'],
['Élévations latérales','12 répétitions','Haltères de 1 kg, bras presque tendus.'],
['Planche sur les avant-bras','30 secondes','Sur les genoux si c’est trop dur.']]},
{t:'Gagner en force',m:25,r:3,w:'semaine 9 et après',ex:[
['Squat avec haltères','15 répétitions','Descends cuisses parallèles au sol.'],
['Pompes inclinées','12 répétitions','Mains sur un support encore plus bas.'],
['Fentes arrière','8 par jambe','Garde-toi près d’un mur au début.'],
['Tirage avec élastique','15 répétitions','Élastique le plus fort.'],
['Développé épaules','12 répétitions','Haltères de 1 kg.'],
['Planche sur les avant-bras','40 secondes','Corps aligné.']]}
];
const MSG=['Dix minutes, c’est déjà gagné. Le plus dur est de commencer.','Ne cherche pas la perfection, cherche la régularité.','Une séance faite, c’est une habitude qui se construit.','Ton corps s’adapte plus vite que tu ne le crois.','Même une séance courte compte. Fais-la.','Tu n’as pas besoin d’être motivé, juste de démarrer.','Chaque semaine tenue vaut mieux qu’une semaine parfaite.','Moins d’excuses, plus de tapis. Dix minutes suffisent.','Ce que tu fais aujourd’hui, tu le sentiras dans un mois.','Une journée ratée ne change rien. Reprends demain.'];

const TYPES=[['bureau','Bureau : vélo ou marche'],['arc','Tir à l’arc'],['maison','Séance maison'],['prepa','Préparation arc (élastique)']];
const DAYS=['L','M','M','J','V','S','D'];
let tab='today',done={},wOff=0;

function dayLog(k){return S.log[k]||[]}
function toggle(k,t){const a=dayLog(k).slice();const i=a.indexOf(t);i>=0?a.splice(i,1):a.push(t);if(a.length)S.log[k]=a;else delete S.log[k];save();render()}
function countHome(from,to){let n=0;for(let d=new Date(from);d<=to;d=addD(d,1))if(dayLog(iso(d)).includes('maison'))n++;return n}
function totalHome(){return Object.values(S.log).filter(a=>a.includes('maison')).length}
function weekCompleteAny(){const m={};for(const k in S.log)if(S.log[k].includes('maison')){const w=weekOf(parse(k));m[w]=(m[w]||0)+1}return Object.keys(m).some(w=>m[w]>=homeTarget(+w))}

function vToday(){
const now=new Date(),k=todayK(),w=weekOf(now),p=PH[phaseOf(w)],m=addD(mon(now),7*wOff);
const hm=countHome(m,addD(m,6)),tg=homeTarget(weekOf(m)),wm=weekMin(m);
let wk='';for(let i=0;i<7;i++){const d=addD(m,i),on=hasAct(iso(d));wk+=`<div class="day${iso(d)===k?' now':''}">${DAYS[i]}<div class="dot${on?' on':''}">${on?'✓':''}</div></div>`}
const dayN=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5);
const last=S.weights.length?S.weights[S.weights.length-1]:null;
return`<h1>Semaine ${w}</h1><p class="mute">${p.t} : séances de ${p.m} minutes</p>
<div class="card hero"><p>${MSG[dayN%MSG.length]}</p></div>
<div class="card"><h2>Aujourd’hui</h2><div class="chips">${TYPES.map(([id,l])=>`<button class="chip${dayLog(k).includes(id)?' on':''}" onclick="toggle('${k}','${id}')"><span>${l}</span><span>${dayLog(k).includes(id)?'✓ Fait':'Marquer fait'}</span></button>`).join('')}</div>
<p class="mute" style="margin-top:10px">Pour la séance maison, ouvre l’onglet Séance : elle se coche toute seule à la fin.</p></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button class="alt" style="width:auto;padding:6px 14px" onclick="wOff--;render()" aria-label="Semaine précédente">◀</button><h2 style="margin:0">${wOff===0?'Cette semaine':'Semaine '+weekOf(m)}</h2><button class="alt" style="width:auto;padding:6px 14px" onclick="wOff=Math.min(0,wOff+1);render()" aria-label="Semaine suivante" ${wOff===0?'disabled':''}>▶</button></div>${wOff!==0?`<p class="mute" style="text-align:center;margin:4px 0 0">${m.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} au ${addD(m,6).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</p>`:''}<div class="week">${wk}</div>
<p style="margin-top:12px">Séances maison : <b>${hm} sur ${tg}</b></p><div class="bar"><i style="width:${Math.min(100,hm/tg*100)}%"></i></div>${wm?`<p class="mute">Marche et vélo importés : ${wm} min ${wOff===0?'cette semaine':'cette semaine-là'}</p>`:''}</div>
<div class="card"><h2>Poids</h2>${last?`<p class="mute">Dernière pesée : ${fmtKg(last.kg)} kg le ${parse(last.d).toLocaleDateString('fr-FR')}</p>`:'<p class="mute">Aucune pesée pour l’instant.</p>'}
<button class="alt" onclick="go('weight')">Ajouter une pesée</button></div>`}

const HOW={
'Squat sur chaise':'Place une chaise derrière toi, pieds écartés largeur d’épaules. Pousse les fesses vers l’arrière comme pour t’asseoir, dos droit, regard devant. Effleure l’assise, puis remonte en poussant dans les talons. Les genoux restent dans l’axe des pieds. Expire en remontant.',
'Pompes contre le mur':'Mains à plat sur le mur à hauteur d’épaules, un peu plus larges qu’elles. Recule les pieds d’un grand pas. Fléchis les coudes pour approcher la poitrine du mur, coudes à environ 45° du corps, puis repousse. Garde le corps en ligne droite, ventre serré. Expire en poussant.',
'Pont fessier':'Allongé sur le dos, genoux fléchis, pieds à plat à largeur de bassin. Pousse dans les talons pour monter le bassin jusqu’à aligner épaules, hanches et genoux. Serre les fessiers, puis redescends lentement. Ne creuse pas le bas du dos.',
'Tirage avec élastique':'Assis au sol, jambes tendues, élastique passé autour des pieds (ou fixé à une poignée de porte à hauteur de poitrine). Tire les mains vers le ventre, coudes le long du corps, en rapprochant les omoplates. Reviens lentement sans relâcher la tension. Garde les épaules basses.',
'Planche sur les genoux':'Genoux au sol, avant-bras ou mains sous les épaules. Du genou à la tête, le corps forme une ligne droite. Serre le ventre et les fessiers, regarde le sol, respire normalement. Arrête si le bas du dos se creuse.',
'Pompes inclinées':'Mains sur une table solide ou un canapé, un peu plus larges que les épaules, corps en ligne droite. Fléchis les coudes pour descendre la poitrine vers le support, puis repousse. Plus le support est bas, plus c’est difficile.',
'Squat avec haltères':'Même mouvement que le squat sur chaise, avec un haltère de 1 kg dans chaque main le long du corps. Dos droit, talons au sol. Descends jusqu’à ce que les cuisses soient presque horizontales, puis remonte.',
'Élévations latérales':'Debout, un haltère dans chaque main, bras le long du corps, coudes légèrement fléchis. Monte les bras sur les côtés jusqu’à hauteur d’épaules, pas plus haut, puis redescends en 2 ou 3 secondes. Ne balance pas le buste.',
'Planche sur les avant-bras':'Avant-bras au sol, coudes sous les épaules, pointes de pieds au sol. Corps en ligne droite de la tête aux talons. Serre le ventre et les fessiers, ne laisse pas le bassin s’affaisser ni monter. Respire.',
'Fentes arrière':'Debout près d’un mur pour l’équilibre, pieds à largeur de hanches. Recule une jambe d’un grand pas et fléchis les deux genoux jusqu’à frôler le sol avec le genou arrière. Remonte en poussant dans le pied avant. Buste droit.',
'Développé épaules':'Debout ou assis, haltères à hauteur des épaules, paumes vers l’avant. Pousse-les au-dessus de la tête jusqu’à avoir les bras presque tendus, puis redescends lentement. Ne cambre pas le dos, garde le ventre serré.',
'Rotation externe avec élastique':'Debout, élastique fixé à hauteur de coude (poignée de porte). Plie le coude à 90° et garde-le collé au corps, avec une serviette roulée entre le coude et les côtes. Éloigne la main du ventre vers l’extérieur sans bouger le coude, puis reviens lentement. Élastique léger.',
'Écartement d’élastique':'Debout, élastique tenu à deux mains devant toi, bras tendus à hauteur d’épaules. Écarte les bras sur les côtés en rapprochant les omoplates, jusqu’à ouvrir la poitrine. Reviens lentement. Épaules basses, loin des oreilles.',
'Tenue de traction avec élastique':'Élastique fixé à hauteur d’épaule, tenu d’une main. Tire vers l’arrière en pliant le coude, épaule basse et dos droit, puis maintiens 5 secondes. Reviens lentement. Fais 5 tenues d’un côté, puis de l’autre.',
'Planche latérale':'Allongé sur le côté, appui sur l’avant-bras, coude sous l’épaule, genoux fléchis au sol. Monte le bassin pour aligner épaule, hanche et genou. Tiens la position, puis change de côté. Jambes tendues quand ce devient facile.',
'Oiseau-chien':'À quatre pattes, mains sous les épaules, genoux sous les hanches. Tends un bras devant et la jambe opposée derrière, dos plat, bassin immobile. Reviens lentement, puis change de côté.',
'Étirement des pectoraux':'Avant-bras contre l’encadrement d’une porte, coude à hauteur d’épaule. Avance doucement le buste jusqu’à sentir un étirement devant l’épaule. Tiens la durée indiquée, sans douleur, puis change de côté.'
};
const ARC={t:'Préparation arc',m:12,r:2,ex:[
['Rotation externe avec élastique','12 par côté','Élastique léger, coude collé au corps.'],
['Écartement d’élastique','12 répétitions','Omoplates rapprochées, épaules basses.'],
['Tenue de traction avec élastique','5 fois 5 secondes par côté','Mouvement lent, épaule basse.'],
['Planche latérale','15 secondes par côté','Sur les genoux au début.'],
['Oiseau-chien','8 par côté','Dos plat, bassin immobile.'],
['Étirement des pectoraux','30 secondes par côté','Sans douleur, respire calmement.']]};
let sess='home';
function exHtml(e){const h=HOW[e[0]];return`<div class="ex"><input type="checkbox" aria-label="Fait"><div><b>${e[0]} : ${e[1]}</b><span class="mute">${e[2]}</span>${h?`<details><summary>Comment faire</summary><p>${h}</p></details>`:''}</div></div>`}
function seg(){return`<div class="row seg" style="margin:12px 0"><button class="${sess==='home'?'':'alt'}" onclick="sess='home';render()">Renforcement</button><button class="${sess==='arc'?'':'alt'}" onclick="sess='arc';render()">Préparation arc</button></div>`}
function vSession(){
if(sess==='arc')return`<h1>Préparation arc</h1><p class="mute">Environ ${ARC.m} minutes, 1 à 2 fois par semaine</p>${seg()}
<div class="card"><p>Ces exercices renforcent le haut du dos, les épaules et le tronc, qui travaillent beaucoup au tir. Fais-les un autre jour que le tir, ou après ta séance. Ils ne remplacent pas les conseils de ton moniteur sur la technique.</p></div>
<div class="card"><h2>${ARC.r} tours</h2><p class="mute">Passe à 3 tours quand c’est facile. Arrête-toi en cas de douleur à l’épaule.</p>${ARC.ex.map(exHtml).join('')}</div>
<button onclick="finish('prepa')">Terminer la séance</button>`;
const w=weekOf(new Date()),i=phaseOf(w),p=PH[i];
return`<h1>Séance maison</h1><p class="mute">${p.t} : environ ${p.m} minutes</p>${seg()}
<div class="card"><h2>Échauffement (2 minutes)</h2><p class="mute">Cercles d’épaules, montées de genoux, rotations du bassin.</p></div>
<div class="card"><h2>${p.r} tours</h2><p class="mute">Enchaîne les exercices, repose-toi 45 secondes entre chaque tour. Appuie sur « Comment faire » pour le détail.</p>${p.ex.map(exHtml).join('')}
<p class="mute" style="margin-top:10px">Une courbature est normale. Une douleur vive ne l’est pas : arrête-toi.</p></div>
<button onclick="finish('maison')">Terminer la séance</button>
<div class="card"><h2>La progression</h2>${PH.map((x,n)=>`<div class="ph${n===i?' cur':''}"><span>${x.t}</span><span>${x.m} min, ${x.w}</span></div>`).join('')}
<p class="mute" style="margin-top:8px">Si une phase te semble trop dure, reste-y une semaine de plus. Il n’y a pas de retard.</p></div>`}
function finish(t){const k=todayK();const a=dayLog(k).slice();if(!a.includes(t))a.push(t);S.log[k]=a;save();toast('Séance enregistrée. Bravo !');tab='today';render()}

function hasAct(k){return dayLog(k).length>0||Object.values(S.hae.w).some(x=>x.d===k)}
function weekMin(m0){const m=m0||mon(new Date()),a=iso(m),b=iso(addD(m,6));return Object.values(S.hae.w).filter(x=>x.d>=a&&x.d<=b).reduce((t,x)=>t+x.min,0)}
function effortLabel(n){return n==null?'non noté':n<=3?'Facile':n<=6?'Modéré':n<=8?'Difficile':'Maximal'}
function sumQ(a){return Array.isArray(a)?a.reduce((t,x)=>t+((x&&x.qty)||0),0):((a&&a.qty)||0)}
function importHAE(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const j=JSON.parse(r.result),dd=j.data||j;let nw=0;
(dd.workouts||[]).forEach(x=>{const id=x.id||(x.start+x.name);const e=x.activeEnergyBurned||x.activeEnergy;let kc=null;
if(e&&typeof e==='object'&&e.qty!=null){kc=/kj/i.test(e.units||'')?e.qty/4.184:e.qty}
const du=typeof x.duration==='object'?(x.duration&&x.duration.qty)||0:(x.duration||0);
const ef=x.estimatedEffortScore;
const rec={d:String(x.start).slice(0,10),n:x.name||'Séance',in:!!x.isIndoor||/int[ée]rieur|indoor/i.test(x.name||''),min:Math.round(du/60),st:Math.round(sumQ(x.stepCount)),kc:kc==null?null:Math.round(kc),hr:x.avgHeartRate&&x.avgHeartRate.qty?Math.round(x.avgHeartRate.qty):null,ef:ef&&ef.qty!=null?ef.qty:null};
const old=S.hae.w[id];if(!old)nw++;if(rec.in&&!(old&&old.b)){const a=(S.log[rec.d]||[]).slice();if(!a.includes('bureau')){a.push('bureau');S.log[rec.d]=a}}rec.b=1;S.hae.w[id]=rec});
const sc=(dd.metrics||[]).find(m=>m.name==='step_count');
if(sc&&sc.data)sc.data.forEach(p=>{S.hae.s[String(p.date).slice(0,10)]=Math.round(p.qty)});
save();toast(nw+' nouvelle(s) séance(s) importée(s)');render()}catch(e){toast('Fichier non reconnu : choisis le fichier .json')}};
r.readAsText(f);inp.value=''}
function vAct(){
const W=Object.values(S.hae.w).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
const m=mon(new Date()),a=iso(m),b=iso(addD(m,6));
const wk=W.filter(x=>x.d>=a&&x.d<=b),tm=wk.reduce((t,x)=>t+x.min,0),tk=wk.reduce((t,x)=>t+(x.kc||0),0);
const days=Object.keys(S.hae.s).sort().slice(-7),mx=Math.max(1,...days.map(k=>S.hae.s[k]));
const fd=k=>parse(k).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
return`<h1>Activité</h1><p class="mute">Tes séances Apple Watch, importées depuis Health Auto Export.</p>
<div class="card"><h2>Cette semaine</h2>${wk.length?`<p><b>${tm} min</b> sur ${wk.length} séance${wk.length>1?'s':''}${tk?`, environ ${tk} kcal actives`:''}</p>`:'<p class="mute">Aucune séance importée cette semaine.</p>'}</div>
<div class="card"><h2>Importer</h2><p class="mute">Dans Health Auto Export, exporte les séances (Workouts) et les pas au format JSON, sans l’itinéraire. Si tu obtiens un zip, ouvre-le dans Fichiers pour en sortir le .json.</p><button onclick="document.getElementById('h').click()">Choisir le fichier JSON</button><input type="file" id="h" accept=".json,application/json" hidden onchange="importHAE(this)"></div>
${days.length?`<div class="card"><h2>Pas par jour</h2>${days.map(k=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${fd(k)}</span><b>${S.hae.s[k].toLocaleString('fr-FR')}</b></div><div class="bar"><i style="width:${S.hae.s[k]/mx*100}%"></i></div></div>`).join('')}</div>`:''}
<div class="card"><h2>Séances</h2>${W.length?`<ul class="list">${W.slice(0,15).map(x=>`<li><span><b>${fd(x.d)}</b> ${x.n}<br><span class="mute">${x.min} min${x.st?`, ${x.st} pas`:''}${x.kc?`, ${x.kc} kcal`:''}${x.hr?`, FC ${x.hr}`:''}</span></span><span>${effortLabel(x.ef)}${x.ef!=null?' ('+x.ef+')':''}</span></li>`).join('')}</ul>`:'<p class="mute">Rien d’importé pour l’instant.</p>'}</div>`}

function SEED(){return[
{id:'r1',t:'Chili de dinde (exemple)',p:2,ing:'250 g dinde hachée\n1 oignon\n1 gousse d’ail\n1 poivron\n200 g haricots rouges\n200 g tomates concassées\n1 càc paprika\n1 càc cumin\n120 g boulgour'},
{id:'r2',t:'Poulet curry coco (exemple)',p:2,ing:'300 g blanc de poulet\n1 oignon\n1 gousse d’ail\n150 ml lait de coco\n1 càs pâte de curry\n1 courgette\n120 g riz'}]}
const RAYONS=['Fruits et légumes','Viandes et poissons','Crèmerie et œufs','Épicerie','Pain','Surgelés','Autres'];
function rayon(n){n=n.toLowerCase();const tk=n.split(/[^a-zàâçéèêëîïôûùüÿœ]+/);const has=l=>l.some(k=>k.length<=4?tk.includes(k):n.includes(k));
if(has(['lait de coco','concassé','conserve','boîte','pâte','pâtes','riz','boulgour','semoule','lentille','haricots rouges','pois chiche','huile','vinaigre','paprika','cumin','curry','sel','poivre','bouillon','farine','sucre','miel','quinoa','avoine','sauce','moutarde']))return 3;
if(has(['surgelé']))return 5;
if(has(['poulet','dinde','bœuf','boeuf','porc','jambon','saumon','cabillaud','poisson','thon','lardon','steak','merlu','crevette','haché']))return 1;
if(has(['lait','fromage','yaourt','crème','beurre','œuf','oeuf','œufs','oeufs','mozzarella','parmesan','skyr']))return 2;
if(has(['pain','baguette','wrap','tortilla']))return 4;
if(has(['oignon','ail','échalote','carotte','poivron','courgette','tomate','salade','épinard','brocoli','champignon','pomme','banane','citron','poireau','céleri','aubergine','chou','persil','coriandre','gingembre','avocat','concombre','orange','fruit','légume','haricots verts']))return 0;
return 6}
let mOff=0,mt='plan',ed=null;
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const mMon=o=>addD(mon(new Date()),7*o);
function mealsOf(m){const k=iso(m);S.meals[k]=S.meals[k]||{};return S.meals[k]}
function shopList(){const mm=mealsOf(mMon(mOff)),cnt={},L={};
Object.values(mm).forEach(v=>{const r=S.rec.find(x=>x.t.toLowerCase()===String(v).trim().toLowerCase());if(r)cnt[r.id]=(cnt[r.id]||0)+1});
S.rec.forEach(r=>{const c=cnt[r.id];if(!c)return;const f=c/(r.p||1);
r.ing.split('\n').forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|cl|càs|càc)?(?=\s|$)\s*(?:de |d’|d')?(.+)$/i);
let q=null,u='',n=l;if(m){q=parseFloat(m[1].replace(',','.'))*f;u=(m[2]||'').toLowerCase();n=m[3].trim()}
const key=n.toLowerCase()+'|'+u;if(!L[key])L[key]={n,u,q:null};if(q!=null)L[key].q=(L[key].q||0)+q})});
S.extra.forEach(n=>{L[n.toLowerCase()+'|x']={n,u:'',q:null,x:1}});
const w=iso(mMon(mOff));return Object.keys(L).map(k=>Object.assign({k:w+'|'+k},L[k]))}
function fq(i){if(i.q==null)return'';const q=i.u?(i.u==='g'||i.u==='ml'?(Math.round(i.q/5)*5||5):Math.round(i.q*10)/10):Math.ceil(i.q-1e-9);return String(q).replace('.',',')+(i.u?' '+i.u:'')+' '}
function mseg(){return`<div class="row seg" style="margin:12px 0">${[['plan','Planning'],['rec','Recettes'],['shop','Courses']].map(x=>`<button class="${mt===x[0]?'':'alt'}" onclick="mt='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`}
function wkNav(){const m=mMon(mOff);return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="alt" style="width:auto;padding:6px 14px" onclick="mOff--;render()" aria-label="Semaine précédente">◀</button><b>${mOff===0?'Cette semaine':mOff===1?'Semaine prochaine':'Semaine du '+m.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</b><button class="alt" style="width:auto;padding:6px 14px" onclick="mOff++;render()" aria-label="Semaine suivante">▶</button></div>`}
function vMeals(){let b='';
if(mt==='plan'){const m=mMon(mOff),mm=mealsOf(m);
b=wkNav()+`<datalist id="rl">${S.rec.map(r=>`<option value="${esc(r.t)}">`).join('')}</datalist>`+[0,1,2,3,4,5,6].map(i=>{const d=addD(m,i),g=i>=1&&i<=3;
return`<div class="card" style="margin:8px 0"><b>${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric'})}</b>`+[['m',g?'Midi : gamelle bureau':'Midi'],['s','Soir']].map(x=>`<input list="rl" style="margin-top:6px" placeholder="${x[1]}" value="${esc(mm[i+x[0]]||'')}" onchange="setMeal(${mOff},'${i}${x[0]}',this.value)" aria-label="${x[1]}">`).join('')+`</div>`}).join('')+'<p class="mute">Choisis une de tes recettes dans la liste pour l’ajouter aux courses, ou écris librement (omelette, salade…).</p>'}
else if(mt==='rec'){const r=ed&&S.rec.find(x=>x.id===ed);
b=S.rec.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.t)}</b><p class="mute" style="margin:2px 0 8px">Ingrédients pour ${x.p} portion${x.p>1?'s':''}, ${x.ing.split('\n').filter(l=>l.trim()).length} lignes</p><div class="row"><button class="alt" onclick="ed='${x.id}';render()">Modifier</button><button class="alt" onclick="delRec('${x.id}')">Supprimer</button></div></div>`).join('')
+`<div class="card"><h2>${r?'Modifier la recette':'Nouvelle recette'}</h2><input id="rt" placeholder="Titre (ex. Poulet curry coco)" value="${r?esc(r.t):''}"><input id="rp" inputmode="numeric" style="margin-top:8px" placeholder="Nombre de portions de la liste d’ingrédients" value="${r?r.p:''}"><textarea id="ri" rows="7" style="margin-top:8px;width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)" placeholder="Un ingrédient par ligne, avec la quantité :&#10;300 g poulet&#10;1 oignon&#10;150 ml lait de coco">${r?esc(r.ing):''}</textarea><button style="margin-top:8px" onclick="saveRec()">Enregistrer</button></div>`}
else{const L=shopList();
b=wkNav()+(L.length?RAYONS.map((n,ri)=>{const it=L.filter(i=>(i.x?6:rayon(i.n))===ri);return it.length?`<div class="card" style="margin:8px 0"><h2>${n}</h2>${it.map(i=>`<label class="ex" style="align-items:center"><input type="checkbox" ${S.shop[i.k]?'checked':''} data-k="${esc(i.k)}" onchange="chk(this)"><span>${fq(i)}${esc(i.n)}</span></label>`).join('')}</div>`:''}).join('')+`<div class="chips" style="margin:12px 0"><button onclick="toReminders()">Envoyer vers Rappels</button><button class="alt" onclick="copyList()">Copier la liste</button></div>`:'<div class="card"><p class="mute">Aucune course pour cette semaine. Ajoute des recettes au planning.</p></div>')
+`<div class="card"><h2>Ajouter un article</h2><div class="row"><input id="ex" placeholder="Ex. café, yaourts"><button onclick="addExtra()">Ajouter</button></div>${S.extra.length?`<p class="mute" style="margin-top:8px">Articles ajoutés : ${S.extra.map((e,i)=>`${esc(e)} <a href="#" onclick="S.extra.splice(${i},1);save();render();return false">retirer</a>`).join(', ')}</p>`:''}</div>`}
return`<h1>Repas</h1><p class="mute">Planning, recettes et liste de courses</p>${mseg()}${b}`}
function setMeal(o,k,v){const mm=mealsOf(mMon(o));if(v.trim())mm[k]=v.trim();else delete mm[k];save()}
function saveRec(){const t=document.getElementById('rt').value.trim(),p=parseInt(document.getElementById('rp').value)||1,ing=document.getElementById('ri').value.trim();
if(!t||!ing){toast('Ajoute un titre et des ingrédients');return}
if(ed){Object.assign(S.rec.find(x=>x.id===ed),{t,p,ing})}else S.rec.push({id:'r'+Date.now(),t,p,ing});ed=null;save();toast('Recette enregistrée');render()}
function delRec(id){if(confirm('Supprimer cette recette ?')){S.rec=S.rec.filter(x=>x.id!==id);save();render()}}
function chk(e){if(e.checked)S.shop[e.dataset.k]=1;else delete S.shop[e.dataset.k];save()}
function addExtra(){const v=document.getElementById('ex').value.trim();if(!v)return;S.extra.push(v);save();render()}
function listText(){const L=shopList().filter(i=>!S.shop[i.k]);return RAYONS.map((n,ri)=>L.filter(i=>(i.x?6:rayon(i.n))===ri).map(i=>(fq(i)+i.n).trim()).join('\n')).filter(Boolean).join('\n')}
function toReminders(){const t=listText();if(!t){toast('Rien à envoyer');return}window.location.href='shortcuts://run-shortcut?name='+encodeURIComponent('Courses')+'&input=text&text='+encodeURIComponent(t)}
function copyList(){const t=listText();if(!t){toast('Rien à copier');return}
const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Liste copiée')}catch(e){toast('Copie impossible')}a.remove()};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Liste copiée'),fb);else fb()}
function addW(){const el=document.getElementById('kg');const v=parseFloat((el.value||'').replace(',','.'));
if(!(v>=30&&v<=300)){toast('Entre un poids entre 30 et 300 kg');return}
const k=todayK();S.weights=S.weights.filter(x=>x.d!==k);S.weights.push({d:k,kg:Math.round(v*10)/10});S.weights.sort((a,b)=>a.d<b.d?-1:1);save();toast('Pesée enregistrée');render()}
function delW(d){S.weights=S.weights.filter(x=>x.d!==d);save();render()}

function chart(){
const W=S.weights;if(W.length<2)return'<p class="mute">Le graphique apparaît à partir de deux pesées.</p>';
const w=320,h=150,px=28,py=14,ks=W.map(x=>x.kg),lo=Math.min(...ks)-1,hi=Math.max(...ks)+1;
const t0=parse(W[0].d).getTime(),t1=parse(W[W.length-1].d).getTime()||1;
const X=d=>px+(w-px-8)*((parse(d).getTime()-t0)/((t1-t0)||1)),Y=v=>py+(h-2*py)*(1-(v-lo)/(hi-lo));
const pts=W.map(x=>X(x.d).toFixed(1)+','+Y(x.kg).toFixed(1)).join(' ');
return`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Courbe du poids"><line x1="${px}" x2="${w-8}" y1="${Y(hi-1)}" y2="${Y(hi-1)}" stroke="var(--line)"/><line x1="${px}" x2="${w-8}" y1="${Y(lo+1)}" y2="${Y(lo+1)}" stroke="var(--line)"/>
<text x="0" y="${Y(hi-1)+4}" font-size="10" fill="var(--mute)">${Math.round(hi-1)}</text><text x="0" y="${Y(lo+1)+4}" font-size="10" fill="var(--mute)">${Math.round(lo+1)}</text>
<polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${W.map(x=>`<circle cx="${X(x.d)}" cy="${Y(x.kg)}" r="4" fill="var(--acc)"/>`).join('')}</svg>`}

function vWeight(){
const W=S.weights;let diff='';
if(W.length>1){const d=W[W.length-1].kg-W[0].kg;diff=`<p><b>${d>0?'+':''}${fmtKg(d)} kg</b> depuis la première pesée</p>`}
return`<h1>Poids</h1><p class="mute">Pèse-toi une fois par semaine, le matin, dans les mêmes conditions. C’est la tendance qui compte, pas un chiffre isolé.</p>
<div class="card">${diff}${chart()}</div>
<div class="card"><h2>Ajouter une pesée</h2><div class="row"><input id="kg" inputmode="decimal" placeholder="Poids en kg" aria-label="Poids en kg"><button onclick="addW()">Enregistrer</button></div></div>
<div class="card"><h2>Historique</h2>${W.length?`<ul class="list">${W.slice().reverse().map(x=>`<li><span>${parse(x.d).toLocaleDateString('fr-FR')}</span><span><b>${fmtKg(x.kg)} kg</b> <button class="alt" style="width:auto;padding:4px 10px;margin-left:8px" onclick="delW('${x.d}')" aria-label="Supprimer">✕</button></span></li>`).join('')}</ul>`:'<p class="mute">Rien pour l’instant.</p>'}</div>`}

function vMore(){
const n=totalHome(),act=Object.keys(S.log).length;
const B=[['Première séance maison',n>=1],['5 séances maison',n>=5],['10 séances maison',n>=10],['25 séances maison',n>=25],['Une semaine complète',weekCompleteAny()],['Première pesée',S.weights.length>=1],['20 jours actifs',act>=20]];
return`<h1>Progrès</h1><div class="card"><p><b>${n}</b> séances maison, <b>${act}</b> jours actifs depuis le début.</p>${B.map(b=>`<span class="badge${b[1]?' on':''}">${b[0]}</span>`).join('')}</div>
<div class="card"><h2>Date de départ du programme</h2><p class="mute">Elle fixe la semaine 1 et la progression.</p><div class="row"><input type="date" id="st" value="${S.start}"><button onclick="setStart()">Valider</button></div></div>
<div class="card"><h2>Sauvegarde</h2><p class="mute">Tes données restent dans ce navigateur. Exporte un fichier de temps en temps, ou pour les copier sur un autre appareil.</p>
<div class="chips"><button class="alt" onclick="exp()">Exporter mes données</button><button class="alt" onclick="document.getElementById('f').click()">Importer un fichier</button><input type="file" id="f" accept="application/json,.json" hidden onchange="imp(this)"><button class="alt" onclick="reset()">Tout effacer</button></div></div>
<p class="mute">Ce programme ne remplace pas un avis médical. Parle-en à ton médecin avant d’intensifier.</p>`}
function setStart(){const v=document.getElementById('st').value;if(!v)return;S.start=v;save();toast('Date mise à jour');render()}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='suivi-'+todayK()+'.json';document.body.appendChild(a);a.click();a.remove()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.log||!o.weights||!o.start)throw 0;S=norm(o);save();toast('Données importées');render()}catch(e){toast('Fichier non valide')}};r.readAsText(f)}
function reset(){if(confirm('Effacer toutes tes données sur cet appareil ?')){S=fresh();save();render()}}

const TABS=[['today','Accueil',vToday],['act','Activité',vAct],['session','Séance',vSession],['meals','Repas',vMeals],['weight','Poids',vWeight],['more','Progrès',vMore]];
function render(){
document.getElementById('app').innerHTML=TABS.find(t=>t[0]===tab)[2]();
document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
}
function go(t){tab=t;if(t==='today')wOff=0;render();window.scrollTo(0,0)}
render();
</script>
</body>
</html>
